<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  (click)="onClick.emit($event)"
>
  @if (loading()) {
    <span
      class="size-4 animate-spin rounded-full border-2 border-current border-r-transparent"
      aria-hidden="true"
    ></span>
  }

  <ng-content></ng-content>
</button>
