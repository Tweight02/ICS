<aside class="sidebar">

  <!-- BRAND -->
  <div class="sidebar-brand">

    <div class="brand-logo">
      ICS
    </div>

    <div class="brand-text">
      <strong>ICS</strong>
      <span>NELM</span>
    </div>

  </div>


  <!-- MENU -->
  <nav class="sidebar-nav">

    <div class="nav-section-title">
      MENU
    </div>

    @for (item of menuItems; track item.route) {

      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >

        @if (item.icon) {
          <span class="nav-icon">
            {{ item.icon }}
          </span>
        }

        <span class="nav-label">
          {{ item.label }}
        </span>

      </a>

    }

  </nav>


  <!-- USER AREA -->
  <div class="sidebar-bottom">

    @if (user) {

      <div class="user-card">

        <div class="user-avatar">
          {{ userInitials }}
        </div>

        <div class="user-info">

          <strong>
            {{ userName }}
          </strong>

          <span>
            {{ roleName }}
          </span>

        </div>

      </div>

    }


    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >

      <span class="logout-icon">
        ↪
      </span>

      <span>
        Logout
      </span>

    </button>

  </div>

</aside>
