<aside class="sidebar d-flex flex-column" [class.collapsed]="collapsed">

  <!-- ===================== BRAND ===================== -->
  <div class="sidebar-brand d-flex align-items-center gap-2">

    <img
      src="/assets/logo.png"
      alt="NELM logo"
      class="brand-logo"
    />

    <div class="brand-text lh-1">
      <div class="brand-title">
        Northeast Luzon Mission
      </div>
    </div>

  </div>


  <!-- ===================== MENU ===================== -->
  <nav class="nav flex-column gap-1 px-3 mt-4 flex-grow-1">

    @for (item of menuItems; track item.route) {

      <a
        class="nav-link sidebar-link d-flex align-items-center gap-2"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        [attr.title]="collapsed ? item.label : null"
      >

        @if (item.icon) {
          <i class="bi {{ item.icon }}"></i>
        }

        <span class="nav-label">
          {{ item.label }}
        </span>

      </a>

    }

  </nav>

  <div class="sidebar-bottom py-3">

    @if (user) {

      <a
        class="user-profile-link user-row d-flex align-items-center gap-2 mb-3"
        routerLink="/profile"
        [attr.title]="collapsed ? 'Edit profile' : null"
        aria-label="Open profile settings">

        <span class="user-avatar">
          @if (user.profile_image) {
            <img [src]="profileImageUrl" alt="" />
          } @else {
            {{ userInitials }}
          }
        </span>

        <div class="user-info lh-sm overflow-hidden">

          <div class="user-name text-truncate">
            {{ userName }}
          </div>

          <div class="user-role text-truncate">
            {{ roleName }}
          </div>

        </div>
      </a>

    }


    <!-- LOGOUT -->
    <button
      type="button"
      class="btn logout-btn d-flex align-items-center gap-2 p-0"
      (click)="logout()"
      [attr.title]="collapsed ? 'Log out' : null"
    >

      <i class="bi bi-box-arrow-left"></i>

      <span>
        Log out
      </span>

    </button>

  </div>

</aside>

<button
  type="button"
  class="sidebar-floating-toggle"
  [class.collapsed]="collapsed"
  (click)="toggleSidebar()"
  [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
  [attr.aria-expanded]="!collapsed"
>
  <i class="bi bi-list" aria-hidden="true"></i>
</button>
