@if (showSidebar) {
  <app-sidebar
    [user]="currentUser()!"
    (collapsedChange)="collapsed = $event"
  />

  @if (!collapsed) {
    <button
      type="button"
      class="app-sidebar-backdrop"
      aria-label="Close navigation"
      (click)="collapsed = true"
    ></button>
  }
}

<main
  class="app-main"
  [class.sidebar-visible]="showSidebar"
  [class.sidebar-collapsed]="showSidebar && collapsed"
  [class.sidebar-expanded]="showSidebar && !collapsed"
  [class.no-sidebar]="!showSidebar"
>
  <!-- Background overlay -->
  <div class="app-background-overlay"></div>

  <!-- Main page content -->
  <div class="app-content">
    <router-outlet />
  </div>
</main>
