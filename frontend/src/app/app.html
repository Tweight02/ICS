@if (showSidebar) {
  <app-sidebar
    [user]="currentUser()!"
    [collapsed]="collapsed"
    (collapsedChange)="collapsed = $event"
  />

  @if (!collapsed) {
    <button
      type="button"
      class="hidden max-lg:fixed max-lg:inset-0 max-lg:z-[900] max-lg:block max-lg:border-0 max-lg:bg-[rgba(2,24,17,0.32)]"
      aria-label="Close navigation"
      (click)="collapsed = true"
    ></button>
  }
}

<main
  class="relative min-h-screen ml-0 overflow-x-clip bg-[#edf7f0] font-sans text-slate-800 [font-family:Inter,Segoe_UI,Arial,sans-serif] transition-[margin-left] duration-200 motion-reduce:transition-none max-lg:ml-0 lg:has-[app-events-home]:flex lg:has-[app-events-home]:h-dvh lg:has-[app-events-home]:min-h-0 lg:has-[app-events-home]:flex-col lg:has-[app-events-home]:overflow-hidden"
  [ngClass]="{
    'lg:ml-[235px]': showSidebar && !collapsed,
    'lg:ml-[76px]': showSidebar && collapsed
  }"
>
  @if (!isLoginPage) {
    <img
      src="/assets/Misty.png"
      alt=""
      aria-hidden="true"
      class="pointer-events-none fixed inset-0 z-0 h-full w-full object-cover object-center opacity-70"
      [ngClass]="{
        'lg:left-[235px]': showSidebar && !collapsed,
        'lg:left-[76px]': showSidebar && collapsed
      }"
    />
  }

  <div
    class="pointer-events-none fixed inset-0 z-0 bg-[linear-gradient(135deg,rgba(244,250,247,0.88)_0%,rgba(237,247,242,0.82)_48%,rgba(255,255,255,0.9)_100%)] transition-[left] duration-200 motion-reduce:transition-none"
    [ngClass]="{
      'lg:left-[235px]': showSidebar && !collapsed,
      'lg:left-[76px]': showSidebar && collapsed
    }"
  ></div>

  <!-- Main page content -->
  <div
    class="relative z-[1] box-border min-h-screen min-w-0 max-w-full p-[1rem_clamp(1rem,2.25vw,1.75rem)] max-lg:px-4 max-lg:pt-[4.25rem] max-lg:pb-4 max-[480px]:px-2.5 max-[480px]:pt-16 max-[480px]:pb-3 lg:has-[app-events-home]:flex lg:has-[app-events-home]:min-h-0 lg:has-[app-events-home]:flex-1 lg:has-[app-events-home]:flex-col lg:has-[app-events-home]:overflow-hidden"
    [ngClass]="{ '!p-0': isLoginPage }"
  >
    <router-outlet />
  </div>
</main>
