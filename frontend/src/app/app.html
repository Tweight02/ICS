@if (showSidebar) {
  <app-sidebar
    [user]="currentUser"
    (collapsedChange)="collapsed = $event"
  />
}

<main
  class="content"
  [class.no-sidebar]="!showSidebar"
  [class.collapsed]="collapsed"
>
  <div class="content-bg"></div>

  <div class="content-inner">
    <router-outlet />
  </div>
</main>
