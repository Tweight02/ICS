  function b64ToUtf8(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  document.getElementById('frame-reports').srcdoc = b64ToUtf8(REPORTS_B64);

  const navItems = document.querySelectorAll('.rail-item[data-view]');
  const frames = {
    reports: document.getElementById('frame-reports'),
  };
  navItems.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      navItems.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(frames).forEach(([key, frame])=>{
        frame.classList.toggle('active', key === btn.dataset.view);
      });
    });
  });
</script>
