<div class="form-page">

  <div class="form-card">

    <!-- Header -->
    <div class="form-header">
      <div>
        <div class="record-label">ADD DEATH RECORD</div>
      </div>
    </div>

    <!-- Form -->
    <form
      #deathForm="ngForm"
      (ngSubmit)="saveDeath()">

      <div class="form-body">

        <div class="form-grid">

          <!-- Baptized Member: Searchable Dropdown -->
          <div class="form-group">
            <label for="baptism_search">Baptized Member</label>

            <div
              class="member-select-wrapper"
              #memberDropdown
              [class.open]="memberDropdownOpen">

              <div class="member-search-control">

                <!-- Search Icon -->
                <svg
                  class="member-search-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true">
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>

                <!-- Search Input -->
                <input
                  id="baptism_search"
                  type="text"
                  class="form-control member-search-input"
                  [value]="
                    memberDropdownOpen
                      ? baptismSearch
                      : getSelectedBaptismName()
                  "
                  (focus)="openBaptismDropdown()"
                  (input)="onBaptismSearch($event)"
                  [placeholder]="
                    loadingBaptisms || loadingDeaths
                      ? 'Loading records...'
                      : deathLoadError
                        ? 'Unable to verify death records'
                        : availableBaptisms.length === 0
                          ? 'No eligible members available'
                          : 'Search or select baptized member'
                  "
                  autocomplete="off"
                  [disabled]="
                    loadingBaptisms ||
                    loadingDeaths ||
                    deathLoadError ||
                    availableBaptisms.length === 0
                  "
                  aria-label="Search baptized members"
                  aria-autocomplete="list"
                  [attr.aria-expanded]="memberDropdownOpen"
                  (keydown.escape)="closeBaptismDropdown()">

                <!-- Dropdown Arrow -->
                <button
                  type="button"
                  class="member-dropdown-toggle"
                  (click)="toggleBaptismDropdown()"
                  [disabled]="
                    loadingBaptisms ||
                    loadingDeaths ||
                    deathLoadError ||
                    availableBaptisms.length === 0
                  "
                  aria-label="Toggle baptized member dropdown">

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>

                </button>
              </div>

              <!-- Member Options -->
              <div
                class="member-dropdown-menu"
                *ngIf="memberDropdownOpen"
                role="listbox">

                <button
                  type="button"
                  class="member-option"
                  role="option"
                  *ngFor="let baptism of filteredAvailableBaptisms"
                  [class.selected]="
                    sameBaptism(
                      baptism.baptism_id,
                      death.baptism_id
                    )
                  "
                  [attr.aria-selected]="
                    sameBaptism(
                      baptism.baptism_id,
                      death.baptism_id
                    )
                  "
                  (click)="chooseBaptism(baptism)">

                  {{ getFullName(baptism) }}

                </button>

                <div
                  class="member-dropdown-message"
                  *ngIf="filteredAvailableBaptisms.length === 0">

                  No matching baptized members found.

                </div>

              </div>

            </div>

            <!-- Keep baptism_id connected to Angular validation -->
            <input
              type="hidden"
              name="baptism_id"
              [(ngModel)]="death.baptism_id"
              required>

            <!-- Existing Help Messages -->
            <small
              *ngIf="loadingBaptisms || loadingDeaths"
              class="form-help">
              Checking existing records...
            </small>

            <small
              *ngIf="deathLoadError"
              class="form-help">
              Death records could not be verified. Refresh the page to try again.
            </small>

            <small
              *ngIf="
                !loadingBaptisms &&
                !loadingDeaths &&
                !deathLoadError &&
                baptisms.length === 0
              "
              class="form-help">
              No baptism records found.
            </small>

            <small
              *ngIf="
                !loadingBaptisms &&
                !loadingDeaths &&
                !deathLoadError &&
                baptisms.length > 0 &&
                availableBaptisms.length === 0
              "
              class="form-help">
              All available baptized members already have death records.
            </small>

          </div>

          <!-- NAME FIELDS: FOUR FIELDS IN ONE ROW -->
          <div
            class="name-fields-row"
            style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; grid-column: 1 / -1; width: 100%;">

            <!-- First Name -->
            <div class="form-group" style="min-width: 0;">
              <label for="first_name">
                First Name
              </label>

              <input
                id="first_name"
                type="text"
                name="first_name"
                class="form-control"
                [value]="selectedBaptism?.first_name || ''"
                placeholder="First name"
                readonly>
            </div>

            <!-- Middle Name -->
            <div class="form-group" style="min-width: 0;">
              <label for="middle_name">
                Middle Name
              </label>

              <input
                id="middle_name"
                type="text"
                name="middle_name"
                class="form-control"
                [value]="selectedBaptism?.middle_name || ''"
                placeholder="Middle name"
                readonly>
            </div>

            <!-- Last Name -->
            <div class="form-group" style="min-width: 0;">
              <label for="last_name">
                Last Name
              </label>

              <input
                id="last_name"
                type="text"
                name="last_name"
                class="form-control"
                [value]="selectedBaptism?.last_name || ''"
                placeholder="Last name"
                readonly>
            </div>

            <!-- Extension Name -->
            <div class="form-group" style="min-width: 0;">
              <label for="extension_name">
                Extension Name
              </label>

              <input
                id="extension_name"
                type="text"
                name="extension_name"
                class="form-control"
                [value]="selectedBaptism?.extension_name || ''"
                placeholder="Jr., Sr., III, IV, etc."
                readonly>
            </div>

          </div>

          <!-- Church -->
          <div class="form-group">
            <label for="church">
              Church
            </label>

            <input
              id="church"
              type="text"
              name="church"
              class="form-control"
              [value]="getChurchName(selectedBaptism?.church_id)"
              placeholder="Church"
              readonly>
          </div>

          <!-- Birthdate -->
          <div class="form-group">
            <label for="birthdate">
              Birthdate
            </label>

            <input
              id="birthdate"
              type="date"
              name="birthdate"
              class="form-control"
              [value]="selectedBaptism?.birthdate || ''"
              readonly>
          </div>

          <!-- Quarter -->
          <div class="form-group">
            <label for="quarter">
              Quarter
            </label>

            <select
              id="quarter"
              class="form-control"
              name="quarter"
              [(ngModel)]="death.quarter"
              required>

              <option
                value=""
                disabled>
                Select quarter
              </option>

              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>

            </select>
          </div>

          <!-- Date of Death -->
          <div class="form-group">
            <label for="date_of_death">
              Date of Death
            </label>

            <input
              id="date_of_death"
              type="date"
              name="date_of_death"
              class="form-control"
              [(ngModel)]="death.date_of_death"
              [max]="today"
              required>
          </div>

          <!-- Age at Death -->
          <div class="form-group">
            <label for="age">
              Age at Death
            </label>

            <input
              id="age"
              type="number"
              name="age"
              class="form-control"
              [value]="
                selectedBaptism && death.date_of_death
                  ? calculateAgeAtDeath(
                      selectedBaptism.birthdate,
                      death.date_of_death
                    )
                  : ''
              "
              placeholder="Age at death"
              min="0"
              readonly>
          </div>

          <!-- Gender -->
          <div class="form-group">
            <label for="gender">
              Gender
            </label>

            <input
              id="gender"
              type="text"
              name="gender"
              class="form-control"
              [value]="selectedBaptism?.gender || ''"
              placeholder="Gender"
              readonly>
          </div>

          <!-- Marital Status -->
          <div class="form-group">
            <label for="marital_status">
              Marital
            </label>

            <input
              id="marital_status"
              type="text"
              name="marital_status"
              class="form-control"
              [value]="selectedBaptism?.marital_status || ''"
              placeholder="Marital status"
              readonly>
          </div>

        </div>

      </div>

      <!-- Footer -->
      <div class="form-footer">

        <button
          type="button"
          class="cancel-button"
          (click)="cancelForm()">
          Cancel
        </button>

        <button
          type="submit"
          class="save-button"
          [disabled]="
            saving ||
            deathForm.invalid ||
            loadingBaptisms ||
            loadingDeaths ||
            deathLoadError
          ">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>

      </div>

    </form>

  </div>

</div>
