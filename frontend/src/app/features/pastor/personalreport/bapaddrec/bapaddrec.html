<div class="form-page">

  <div class="form-card">

    <!-- Header -->
    <div class="form-header">
      <div>
        <h1>Add Baptism Record</h1>
      </div>
    </div>

    <!-- Form -->
    <form
      #baptismForm="ngForm"
      (ngSubmit)="saveBaptism()">

      <div class="form-body">

        <div class="form-grid">

          <!-- First Name -->
          <div class="form-group">
            <label for="first_name">
              First Name
            </label>

            <input
              id="first_name"
              type="text"
              name="first_name"
              class="form-control"
              [(ngModel)]="baptism.first_name"
              placeholder="First name"
              autocomplete="given-name"
              required>
          </div>

          <!-- Middle Name -->
          <div class="form-group">
            <label for="middle_name">
              Middle Name
            </label>

            <input
              id="middle_name"
              type="text"
              name="middle_name"
              class="form-control"
              [(ngModel)]="baptism.middle_name"
              placeholder="Middle name"
              autocomplete="additional-name">
          </div>

          <!-- Last Name -->
          <div class="form-group">
            <label for="last_name">
              Last Name
            </label>

            <input
              id="last_name"
              type="text"
              name="last_name"
              class="form-control"
              [(ngModel)]="baptism.last_name"
              placeholder="Last name"
              autocomplete="family-name"
              required>
          </div>

          <!-- Extension Name -->
          <div class="form-group">
            <label for="extension_name">
              Extension Name
            </label>

            <input
              id="extension_name"
              type="text"
              name="extension_name"
              class="form-control"
              [(ngModel)]="baptism.extension_name"
              placeholder="Jr., Sr., III, IV, etc.">
          </div>

          <!-- Church -->
          <div class="form-group">
            <label for="church_id">
              Church
            </label>

            <select
              id="church_id"
              class="form-control"
              name="church_id"
              [(ngModel)]="baptism.church_id"
              required>

              <option
                [ngValue]="null"
                disabled>
                {{
                  churches.length === 0
                    ? 'Loading churches...'
                    : 'Select church'
                }}
              </option>

              <option
                *ngFor="let church of churches"
                [ngValue]="church.church_id">
                {{ church.name }}
              </option>

            </select>

            <small
              *ngIf="churches.length === 0"
              class="form-help">
              No churches loaded. Please make sure the Laravel server is running.
            </small>
          </div>

          <!-- Quarter -->
          <div class="form-group">
            <label for="quarter">
              Quarter
            </label>

            <select
              id="quarter"
              class="form-control"
              name="quarter"
              [(ngModel)]="baptism.quarter"
              required>

              <option
                value=""
                disabled>
                Select quarter
              </option>

              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>

            </select>
          </div>

          <!-- Baptism Status -->
          <div class="form-group">
            <label for="is_reclaimed">
              Baptism Status
            </label>

            <select
              id="is_reclaimed"
              class="form-control"
              name="is_reclaimed"
              [(ngModel)]="baptism.is_reclaimed"
              required>

              <option
                [ngValue]="null"
                disabled>
                Select baptism status
              </option>

              <option [ngValue]="false">
                Newly Baptized
              </option>

              <option [ngValue]="true">
                Reclaimed Member
              </option>

            </select>

            <small class="form-help">
              Choose whether the member is newly baptized or reclaimed.
            </small>
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">
              Address
            </label>

            <input
              id="address"
              type="text"
              name="address"
              class="form-control"
              [(ngModel)]="baptism.address"
              placeholder="Enter complete address">
          </div>

          <!-- Birthdate -->
          <div class="form-group">
            <label for="birthdate">
              Birthdate
            </label>

            <input
              id="birthdate"
              type="date"
              name="birthdate"
              class="form-control"
              [(ngModel)]="baptism.birthdate"
              (change)="calculateAge()"
              [max]="today"
              required>

            <small class="form-help">
              Birthdate cannot be later than today.
            </small>
          </div>

          <!-- Date of Baptism -->
          <div class="form-group">
            <label for="date_of_baptism">
              Date of Baptism
            </label>

            <input
              id="date_of_baptism"
              type="date"
              name="date_of_baptism"
              class="form-control"
              [(ngModel)]="baptism.date_of_baptism"
              [max]="today"
              required>

            <small class="form-help">
              Date of Baptism cannot be later than today.
            </small>
          </div>

          <!-- Officiating Minister -->
          <div class="form-group">
            <label for="officiating_minister">
              Officiating Minister
            </label>

            <input
              id="officiating_minister"
              type="text"
              name="officiating_minister"
              class="form-control"
              [(ngModel)]="baptism.officiating_minister"
              placeholder="Enter minister's name">
          </div>

          <!-- Place of Baptism -->
          <div class="form-group">
            <label for="place_of_baptism">
              Place of Baptism
            </label>

            <input
              id="place_of_baptism"
              type="text"
              name="place_of_baptism"
              class="form-control"
              [(ngModel)]="baptism.place_of_baptism"
              placeholder="Enter place of baptism">
          </div>

          <!-- Gender -->
          <div class="form-group">
            <label for="gender">
              Gender
            </label>

            <select
              id="gender"
              class="form-control"
              name="gender"
              [(ngModel)]="baptism.gender"
              required>

              <option
                [ngValue]="null"
                disabled>
                Select gender
              </option>

              <option value="Female">
                Female
              </option>

              <option value="Male">
                Male
              </option>

            </select>
          </div>

          <!-- Marital Status -->
          <div class="form-group">
            <label for="marital_status">
              Marital
            </label>

            <select
              id="marital_status"
              class="form-control"
              name="marital_status"
              [(ngModel)]="baptism.marital_status"
              required>

              <option
                [ngValue]="null"
                disabled>
                Select marital status
              </option>

              <option value="Single">
                Single
              </option>

              <option value="Married">
                Married
              </option>

              <option value="Widowed">
                Widowed
              </option>

            </select>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <div class="form-footer">

        <button
          type="button"
          class="cancel-button"
          (click)="cancelForm()">
          Cancel
        </button>

        <button
          type="submit"
          class="save-button"
          [disabled]="saving || baptismForm.invalid">
          {{ saving ? 'Saving...' : 'Save' }}
        </button>

      </div>

    </form>

  </div>

</div>
