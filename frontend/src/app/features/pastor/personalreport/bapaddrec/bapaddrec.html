
<div class="flex min-h-screen items-start justify-center bg-[#f5f7fa] px-3 py-4 max-[576px]:p-2">
  <div class="mx-auto w-full max-w-[540px] overflow-visible rounded-xl border border-slate-200 bg-white shadow-[0_4px_18px_rgba(15,23,42,0.06)] max-[576px]:max-w-full max-[576px]:rounded-[10px]">

    <!-- Header -->
    <div class="rounded-t-xl border-b border-[#e9edf2] bg-white px-5 py-3 max-[576px]:px-4 max-[576px]:py-3">
      <h1 class="m-0 text-[21px] font-semibold leading-[1.3] text-slate-800 max-[576px]:text-lg">Add Baptism Record</h1>
    </div>

    <!-- Form -->
    <form #baptismForm="ngForm" (ngSubmit)="saveBaptism()">
      <div class="px-5 py-4 max-[576px]:p-3">
        <div class="grid w-full grid-cols-1 gap-3 max-[576px]:gap-2.5">

          <!-- NAME FIELDS: FOUR FIELDS IN ONE ROW -->
          <div class="col-span-full grid w-full grid-cols-4 gap-2 max-[576px]:grid-cols-2">

           <!-- First Name -->
<div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
  <label for="first_name">First Name</label>
  <input
    id="first_name"
    type="text"
    name="first_name"
    class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] !bg-white px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:!bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
    [(ngModel)]="baptism.first_name"
    placeholder="First name"
    autocomplete="given-name"
    required>
</div>

            <!-- Middle Name -->
            <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
              <label for="middle_name">Middle Name</label>
              <input
                id="middle_name"
                type="text"
                name="middle_name"
                class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
                [(ngModel)]="baptism.middle_name"
                placeholder="Middle name"
                autocomplete="additional-name">
            </div>

            <!-- Last Name -->
            <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
              <label for="last_name">Last Name</label>
              <input
                id="last_name"
                type="text"
                name="last_name"
                class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
                [(ngModel)]="baptism.last_name"
                placeholder="Last name"
                autocomplete="family-name"
                required>
            </div>

            <!-- Extension Name -->
            <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
              <label for="extension_name">Extension Name</label>
              <input
                id="extension_name"
                type="text"
                name="extension_name"
                class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
                [(ngModel)]="baptism.extension_name"
                placeholder="Jr., Sr., III, IV, etc.">
            </div>

          </div>

          <!-- Church: Searchable Dropdown -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="church_search">Church</label>

            <div
              class="relative w-full"
              #churchDropdown
              [class.open]="churchDropdownOpen">

              <!-- Search Input Container -->
              <div class="relative w-full">

                <!-- Search Icon -->
                <svg
                  class="pointer-events-none absolute left-[13px] top-1/2 z-10 !h-4 !w-4 -translate-y-1/2 !text-[#64748b]"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#64748b"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true">
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-4-4"></path>
                </svg>

                <!-- Search Input -->
                <input
                  id="church_search"
                  type="text"
                  class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 !py-2 !pl-10 !pr-11 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] placeholder:text-slate-400 focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
                  [value]="churchDropdownOpen ? churchSearch : getSelectedChurchName()"
                  (focus)="openChurchDropdown()"
                  (input)="onChurchSearch($event)"
                  [placeholder]="churchesLoading
                    ? 'Loading district churches...'
                    : churches.length === 0
                      ? 'No churches assigned to your district'
                      : 'Search or select church'"
                  autocomplete="off"
                  [disabled]="churchesLoading || churches.length === 0"
                  aria-label="Search churches"
                  aria-autocomplete="list"
                  [attr.aria-expanded]="churchDropdownOpen"
                  (keydown.escape)="closeChurchDropdown()">

                <!-- Dropdown Arrow -->
                <button
                  type="button"
                  class="absolute right-[5px] top-1/2 flex h-8 w-8 -translate-y-1/2 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent p-0 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
                  (click)="toggleChurchDropdown()"
                  [disabled]="churchesLoading || churches.length === 0"
                  aria-label="Toggle church dropdown">

                  <svg
                    class="h-[18px] w-[18px] transition-transform duration-200"
                    [class.rotate-180]="churchDropdownOpen"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>

              </div>

              <!-- Church Options -->
              <div
                *ngIf="churchDropdownOpen"
                class="absolute left-0 right-0 top-[calc(100%+4px)] z-[1050] max-h-[200px] overflow-y-auto rounded-lg border border-slate-300 bg-white p-1 shadow-[0_8px_20px_rgba(15,23,42,0.1)]"
                role="listbox">

                <button
                  *ngFor="let church of filteredChurches"
                  type="button"
                  class="block w-full cursor-pointer rounded-[5px] border-0 bg-white px-3 py-2 text-left text-[13px] text-slate-700 transition-colors hover:bg-emerald-50 focus-visible:bg-emerald-50 focus-visible:outline-none"
                  role="option"
                  [class.bg-emerald-50]="sameChurch(church.church_id, baptism.church_id)"
                  [class.text-emerald-800]="sameChurch(church.church_id, baptism.church_id)"
                  [attr.aria-selected]="sameChurch(church.church_id, baptism.church_id)"
                  (click)="selectChurch(church)">
                  {{ church.name }}
                </button>

                <div
                  *ngIf="filteredChurches.length === 0"
                  class="p-2.5 text-center text-[13px] text-slate-500">
                  No churches found.
                </div>

              </div>
            </div>

            <!-- Preserve Angular church_id binding and validation -->
            <input
              type="hidden"
              name="church_id"
              [(ngModel)]="baptism.church_id"
              required>
          </div>

          <!-- Quarter -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="quarter">Quarter</label>
            <select
              id="quarter"
              class="box-border block h-[40px] w-full cursor-pointer appearance-none rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 bg-[length:16px_16px] bg-[right_12px_center] bg-no-repeat px-2.5 py-2 pr-[38px] text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20 [background-image:url('data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%20viewBox=%270%200%2016%2016%27%3E%3Cpath%20d=%27m4%206%204%204%204-4%27%20fill=%27none%27%20stroke=%27%2364748b%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E')]"
              name="quarter"
              [(ngModel)]="baptism.quarter"
              required>

              <option value="" disabled>Select quarter</option>
              <option value="Q1">Q1</option>
              <option value="Q2">Q2</option>
              <option value="Q3">Q3</option>
              <option value="Q4">Q4</option>
            </select>
          </div>

          <!-- Baptism Status -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="is_reclaimed">Baptism Status</label>
            <select
              id="is_reclaimed"
              class="box-border block h-[40px] w-full cursor-pointer appearance-none rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 bg-[length:16px_16px] bg-[right_12px_center] bg-no-repeat px-2.5 py-2 pr-[38px] text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20 [background-image:url('data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%20viewBox=%270%200%2016%2016%27%3E%3Cpath%20d=%27m4%206%204%204%204-4%27%20fill=%27none%27%20stroke=%27%2364748b%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E')]"
              name="is_reclaimed"
              [(ngModel)]="baptism.is_reclaimed"
              required>

              <option [ngValue]="null" disabled>
                Select baptism status
              </option>
              <option [ngValue]="false">Newly Baptized</option>
              <option [ngValue]="true">Reclaimed Member</option>
            </select>
          </div>

          <!-- Address -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="address">Address</label>
            <input
              id="address"
              type="text"
              name="address"
              class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
              [(ngModel)]="baptism.address"
              placeholder="Enter complete address">
          </div>

          <!-- Birthdate -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="birthdate">Birthdate</label>
            <input
              id="birthdate"
              type="date"
              name="birthdate"
              class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
              [(ngModel)]="baptism.birthdate"
              (change)="calculateAge(); updateMinimumBaptismDate()"
              [max]="today"
              required>
          </div>

          <!-- Date of Baptism -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="date_of_baptism">Date of Baptism</label>
            <input
              id="date_of_baptism"
              type="date"
              name="date_of_baptism"
              class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
              [(ngModel)]="baptism.date_of_baptism"
              [min]="minimumBaptismDate"
              [max]="today"
              (change)="validateBaptismDate()"
              [attr.aria-describedby]="baptismDateError ? 'baptismDateError' : null"
              required>

            <p
              *ngIf="baptismDateError"
              id="baptismDateError"
              class="mt-1 text-xs font-normal text-red-600">
              {{ baptismDateError }}
            </p>
          </div>

          <!-- Officiating Minister -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="officiating_minister">
              Officiating Minister
            </label>
            <input
              id="officiating_minister"
              type="text"
              name="officiating_minister"
              class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
              [(ngModel)]="baptism.officiating_minister"
              placeholder="Enter minister's name">
          </div>

          <!-- Place of Baptism -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="place_of_baptism">Place of Baptism</label>
            <input
              id="place_of_baptism"
              type="text"
              name="place_of_baptism"
              class="box-border block h-[40px] w-full cursor-pointer rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 px-2.5 py-2 text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20"
              [(ngModel)]="baptism.place_of_baptism"
              placeholder="Enter place of baptism">
          </div>

          <!-- Gender -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="gender">Gender</label>
            <select
              id="gender"
              class="box-border block h-[40px] w-full cursor-pointer appearance-none rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 bg-[length:16px_16px] bg-[right_12px_center] bg-no-repeat px-2.5 py-2 pr-[38px] text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20 [background-image:url('data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%20viewBox=%270%200%2016%2016%27%3E%3Cpath%20d=%27m4%206%204%204%204-4%27%20fill=%27none%27%20stroke=%27%2364748b%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E')]"
              name="gender"
              [(ngModel)]="baptism.gender"
              required>

              <option [ngValue]="null" disabled>Select gender</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
            </select>
          </div>

          <!-- Marital Status -->
          <div class="m-0 flex w-full min-w-0 flex-col [&_label]:mb-1 [&_label]:text-xs [&_label]:font-medium [&_label]:tracking-[0.3px] [&_label]:text-slate-600">
            <label for="marital_status">Marital Status</label>
            <select
              id="marital_status"
              class="box-border block h-[40px] w-full cursor-pointer appearance-none rounded-lg border border-[rgba(22,75,60,0.12)] bg-white/80 bg-[length:16px_16px] bg-[right_12px_center] bg-no-repeat px-2.5 py-2 pr-[38px] text-[13px] text-[#123f33] shadow-none transition-[border-color,box-shadow] focus:border-emerald-600 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600/20 [background-image:url('data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%20viewBox=%270%200%2016%2016%27%3E%3Cpath%20d=%27m4%206%204%204%204-4%27%20fill=%27none%27%20stroke=%27%2364748b%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E')]"
              name="marital_status"
              [(ngModel)]="baptism.marital_status"
              required>

              <option [ngValue]="null" disabled>
                Select marital status
              </option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Widowed">Widowed</option>
            </select>
          </div>

        </div>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 rounded-b-xl border-t border-[#e9edf2] bg-[#fafbfc] px-5 py-3 max-[576px]:px-3 max-[576px]:py-2.5">

        <!-- Cancel Button -->
        <button
          type="button"
          class="inline-flex h-[30px] w-[140px] cursor-pointer items-center justify-center !rounded-[9px] !border !border-[#0c502f] !bg-white px-[18px] text-[13px] font-semibold !text-[#0c502f] !opacity-100 transition-colors duration-200 hover:!border-[#083c23] hover:!bg-[#083c23] hover:!text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0c502f] disabled:cursor-not-allowed motion-reduce:transition-none max-[650px]:w-full"
          (click)="cancelForm()">
          Cancel
        </button>
<!-- Save Button -->
<button
  app-button
  variant="submit"
  size="md"
  type="submit"
  class="inline-flex h-[30px] w-[140px] cursor-pointer items-center justify-center !rounded-[9px] !border !border-[#0c502f] !bg-[#0c502f] px-[18px] text-[13px] font-semibold !text-white !opacity-100 transition-colors duration-200 hover:!border-[#0c502f] hover:!bg-[#0c502f] hover:!text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0c502f] disabled:cursor-not-allowed disabled:!opacity-100 motion-reduce:transition-none max-[650px]:w-full"
  [disabled]="saving || baptismForm.invalid || isBaptismDateInvalid()">
  {{ saving ? 'Saving...' : 'Save' }}
</button>

      </div>
    </form>
  </div>
</div>
