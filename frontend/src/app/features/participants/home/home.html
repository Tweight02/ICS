<div class="home-page min-h-screen text-gray-800">
  <header class="bg-green-800/80 text-white shadow-lg">
    <div class="mx-auto max-w-7xl px-6 py-3">
      <div class="flex items-center gap-4">
        <img src="nelmlogo.png" alt="Northeast Luzon Mission logo" class="h-12 w-12 shrink-0 object-contain" />
        <h1 class="text-2xl font-bold">Event Registration</h1>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-8 lg:px-8">
    <div class="mb-8 text-center">
      <p class="text-sm font-semibold uppercase tracking-widest text-green-200">
        Northeast Luzon Mission
      </p>

      <h2 class="mt-2 text-3xl font-extrabold text-white sm:text-4xl">
        Explore Our Events
      </h2>

      <p class="mt-2 text-sm text-white/90">
        Discover upcoming events and register to participate.
      </p>
    </div>

    <div class="grid grid-cols-1 items-stretch gap-6 md:grid-cols-2 xl:grid-cols-3">
      <article
        *ngFor="let event of events"
        class="flex flex-col overflow-hidden rounded-2xl border border-green-100 bg-white shadow-lg transition duration-200 hover:-translate-y-1 hover:shadow-xl"
      >
        <div [ngClass]="['bg-gradient-to-br', event.banner, 'p-5', 'text-white']">
          <h3 class="text-xl font-bold leading-snug">{{ event.title }}</h3>
        </div>

        <div class="flex flex-1 flex-col p-5">
          <div class="space-y-3 rounded-xl border border-green-100 bg-green-50 p-4 text-sm">
            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18" />
              </svg>
              <span class="font-semibold text-gray-800">{{ event.date }}</span>
            </div>

            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
              </svg>
              <span class="font-semibold text-gray-800">{{ event.time }} &ndash; {{ event.end }}</span>
            </div>

            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-5.5-7-11a7 7 0 0114 0c0 5.5-7 11-7 11z" />
                <circle cx="12" cy="10" r="2.5" />
              </svg>
              <span class="font-semibold text-gray-800">{{ event.venue }}</span>
            </div>

            <div class="flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-green-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v5M10 4.5h4M5 21V12l7-5 7 5v9M3 21h18M10 21v-5h4v5" />
              </svg>
              <span class="font-semibold text-gray-800">{{ event.church }}</span>
            </div>
          </div>

          <p class="mt-4 text-sm leading-relaxed text-gray-600">
            {{ event.description }}
          </p>

          <div class="mt-auto flex flex-col gap-3 pt-6">
            <a
              [href]="registrationUrl(event.id)"
              class="flex items-center justify-center rounded-lg border border-green-700 bg-green-700 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-green-800"
            >
              Register
            </a>
          </div>
        </div>
      </article>
    </div>
  </main>
</div>
