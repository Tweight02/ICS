<div class="text-slate-900 antialiased">

                    <div class="h-16 bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-700"></div>

                                </div>
                            </div>
                            <div class="flex items-start gap-3">
                                <span
                                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-600">
                                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="1.8" aria-hidden="true">

                                    <p class="text-sm font-semibold text-slate-800">Female</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-3">
                                <span
                                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-600">
                                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="1.8" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11ZM12 7.7a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6Z" />
                                    </svg>
                                </span>
                                <div class="min-w-0">
                                    <p class="text-[11px] font-medium text-slate-500">Assigned church</p>
                                    <p class="text-sm font-semibold text-slate-800">Sagunto Central</p>
                                </div>
                            </div>
                            <div class="flex items-start gap-3">
                                <span
                                    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-600">
                                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="1.8" aria-hidden="true">

                <!-- Single unified form -->
                <div class="min-w-0 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">

                        <div class="sm:col-span-2">
                            <h2 class="text-sm font-bold text-slate-900">Personal information</h2>
                        </div>
                        <div>
                            <label for="first_name" class="block text-sm font-semibold text-slate-700">First name <span class="text-rose-600">*</span></label>
                            <input id="first_name" name="first_name" type="text" value="Maria" autocomplete="given-name" required class="mt-1 block w-full rounded-lg border-0 bg-slate-50 px-3 py-2 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 hover:ring-slate-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                        </div>
                        <div>
                            <label for="middle_name" class="block text-sm font-semibold text-slate-700">Middle name <span class="text-rose-600">*</span></label>
                            <input id="middle_name" name="middle_name" type="text" value="Santos" autocomplete="additional-name" class="mt-1 block w-full rounded-lg border-0 bg-slate-50 px-3 py-2 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 hover:ring-slate-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                        </div>
                        <div>
                            <label for="last_name" class="block text-sm font-semibold text-slate-700">Last name <span class="text-rose-600">*</span></label>

                        </div>
                        <div>
                            <label for="extension_name" class="block text-sm font-semibold text-slate-700">Suffix <span class="font-normal text-slate-400">(optional)</span></label>

                        </div>
                        <div>
                            <label for="birthdate" class="block text-sm font-semibold text-slate-700">Birthdate <span class="text-rose-600">*</span></label>
                            <input id="birthdate" name="birthdate" type="date" value="1992-03-14" autocomplete="bday" required class="mt-1 block w-full rounded-lg border-0 bg-slate-50 px-3 py-2 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 hover:ring-slate-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                        </div>
                        <fieldset>
                            <label for="gender" class="block text-sm font-semibold text-slate-700">Gender <span class="text-rose-600">*</span></label>
                            <div class="mt-1 grid grid-cols-2 gap-2 rounded-lg bg-slate-100 p-1">
                                <label class="flex cursor-pointer items-center justify-center rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition has-[:checked]:bg-white has-[:checked]:text-emerald-800 has-[:checked]:shadow-sm has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-emerald-600">
                                    <input type="radio" name="gender" value="Male" class="sr-only" />Male
                                </label>
                                <label class="flex cursor-pointer items-center justify-center rounded-md px-3 py-2 text-sm font-medium text-slate-600 transition has-[:checked]:bg-white has-[:checked]:text-emerald-800 has-[:checked]:shadow-sm has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-emerald-600">
                                    <input type="radio" name="gender" value="Female" checked class="sr-only" />Female
                                </label>
                            </div>
                        </fieldset>

                        <div>
                            <label for="department_id" class="block text-sm font-semibold text-slate-700">Department <span class="text-rose-600">*</span></label>
                            <div class="relative mt-1">
                                <select id="department_id" name="department_id" required class="block w-full appearance-none rounded-lg border-0 bg-slate-50 py-2 pl-3 pr-9 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 transition hover:ring-slate-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700">
                                    <option value="" disabled>Select department</option>
                                    <option selected>Youth</option>
                                    <option>Music</option>
                                    <option>Children</option>
                                </select>
                                <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>

                                    <option value="" disabled>Select church</option>
                                    <option selected>Sagunto Central</option>
                                    <option>Bangui East</option>
                                    <option>Pasuquin North</option>
                                </select>
                                <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
                            </div>
                        </div>

                        <div>

                            <input id="email" name="email" type="email" value="maria.delacruz@company.com" autocomplete="email" required class="mt-1 block w-full rounded-lg border-0 bg-slate-50 px-3 py-2 text-sm text-slate-900 ring-1 ring-inset ring-slate-200 transition placeholder:text-slate-400 hover:ring-slate-300 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-700" />
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-semibold text-slate-700">New password <span class="font-normal text-slate-400">(optional)</span></label>

                            <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg bg-emerald-800 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2">

                                Save changes

                    </div>
                </div>
