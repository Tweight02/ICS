<div class="px-4">
  <header class="mb-8">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Add a new user</h1>
    <p class="mt-1 text-sm text-slate-600">They'll get an email invite to set their password.</p>
  </header>

  <form class="space-y-8 rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">

    <!-- Basic info -->
    <fieldset class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <legend class="sr-only">Basic information</legend>

      <div>
        <label for="first-name" class="block text-sm font-medium">First name</label>
        <input id="first-name" name="first_name" type="text" autocomplete="given-name" required
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600/30" />
      </div>

      <div>
        <label for="last-name" class="block text-sm font-medium">Last name</label>
        <input id="last-name" name="last_name" type="text" autocomplete="family-name" required
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600/30" />
      </div>

      <div class="sm:col-span-2">
        <label for="email" class="block text-sm font-medium">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="name@company.com"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm placeholder:text-slate-400 focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600/30" />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium">
          Phone <span class="font-normal text-slate-500">(optional)</span>
        </label>
        <input id="phone" name="phone" type="tel" autocomplete="tel"
          class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600/30" />
      </div>

      <div>
        <label for="department" class="block text-sm font-medium">Department</label>
        <select id="department" name="department"
          class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-green-600 focus:outline-none focus:ring-2 focus:ring-green-600/30">
          <option value="">Select a department</option>
          <option>Engineering</option>
          <option>Design</option>
          <option>Marketing</option>
          <option>Sales</option>
          <option>Support</option>
        </select>
      </div>
    </fieldset>

    <!-- Role -->
    <fieldset>
      <legend class="text-sm font-medium">Role</legend>
      <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-3">
        <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-300 p-3 has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
          <input type="radio" name="role" value="admin" class="mt-1 text-green-600 focus:ring-green-600" />
          <span>
            <span class="block text-sm font-medium">Admin</span>
            <span class="block text-xs text-slate-600">Full access and billing</span>
          </span>
        </label>
        <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-300 p-3 has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
          <input type="radio" name="role" value="editor" checked class="mt-1 text-green-600 focus:ring-green-600" />
          <span>
            <span class="block text-sm font-medium">Editor</span>
            <span class="block text-xs text-slate-600">Create and edit content</span>
          </span>
        </label>
        <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-300 p-3 has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
          <input type="radio" name="role" value="viewer" class="mt-1 text-green-600 focus:ring-green-600" />
          <span>
            <span class="block text-sm font-medium">Viewer</span>
            <span class="block text-xs text-slate-600">Read-only access</span>
          </span>
        </label>
      </div>
    </fieldset>

    <!-- Actions -->
    <div class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end">
      <button type="reset"
        class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400/50">
        Cancel
      </button>
      <button type="submit"
        class="rounded-lg bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-offset-2">
        Create user
      </button>
    </div>
  </form>
</div>
