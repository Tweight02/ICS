<div class="mx-auto max-w-3xl px-4 py-6 sm:py-10">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate
    class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-stone-900/10">

    <!-- Header: initials preview updates as you type -->
    <header class="flex items-center gap-4 bg-green-900 px-6 py-6 text-white sm:px-8">
      <div aria-hidden="true"
        class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-green-50 text-2xl font-semibold uppercase tracking-wide text-green-900">
        {{ ((form.value.first_name?.[0] ?? '') + (form.value.last_name?.[0] ?? '')) || '+' }}
      </div>
      <div class="min-w-0">
        <h1 class="text-xl font-semibold tracking-tight sm:text-2xl">Add a new user</h1>
        <p class="mt-1 truncate text-sm text-green-100">
          {{ form.value.first_name || form.value.last_name
            ? (form.value.first_name ?? '') + ' ' + (form.value.last_name ?? '')
            : 'Fill in the details below to create an account.' }}
        </p>
      </div>
    </header>

    <div class="divide-y divide-stone-200">

      <!-- Personal details -->
      <section class="px-6 py-6 sm:px-8">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-6">
          <div class="sm:col-span-3">
            <label for="first-name" class="block text-sm font-medium text-stone-700">First name</label>
            <input id="first-name" formControlName="first_name" type="text" autocomplete="given-name"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <div class="sm:col-span-3">
            <label for="middle-name" class="block text-sm font-medium text-stone-700">
              Middle name <span class="font-normal text-stone-400">(optional)</span>
            </label>
            <input id="middle-name" formControlName="middle_name" type="text" autocomplete="additional-name"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <div class="sm:col-span-4">
            <label for="last-name" class="block text-sm font-medium text-stone-700">Last name</label>
            <input id="last-name" formControlName="last_name" type="text" autocomplete="family-name"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <div class="sm:col-span-2">
            <label for="extension-name" class="block text-sm font-medium text-stone-700">
              Suffix <span class="font-normal text-stone-400">(optional)</span>
            </label>
            <input id="extension-name" formControlName="extension_name" type="text" placeholder="Jr., Sr., III"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <div class="sm:col-span-3">
            <label for="birthdate" class="block text-sm font-medium text-stone-700">Birthdate</label>
            <input id="birthdate" formControlName="birthdate" type="date" autocomplete="bday"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <!-- Gender as a segmented control -->
          <fieldset class="sm:col-span-3">
            <legend class="block text-sm font-medium text-stone-700">Gender</legend>
            <div class="mt-1.5 grid grid-cols-2 gap-2">
              <label class="cursor-pointer">
                <input type="radio" formControlName="gender" value="male" class="peer sr-only" />
                <span
                  class="flex items-center justify-center rounded-lg bg-stone-50 px-3 py-2 text-sm font-medium text-stone-600 ring-1 ring-inset ring-stone-300 transition hover:bg-stone-100 peer-checked:bg-green-50 peer-checked:text-green-900 peer-checked:ring-2 peer-checked:ring-green-700 peer-focus-visible:ring-2 peer-focus-visible:ring-green-700">
                  Male
                </span>
              </label>
              <label class="cursor-pointer">
                <input type="radio" formControlName="gender" value="female" class="peer sr-only" />
                <span
                  class="flex items-center justify-center rounded-lg bg-stone-50 px-3 py-2 text-sm font-medium text-stone-600 ring-1 ring-inset ring-stone-300 transition hover:bg-stone-100 peer-checked:bg-green-50 peer-checked:text-green-900 peer-checked:ring-2 peer-checked:ring-green-700 peer-focus-visible:ring-2 peer-focus-visible:ring-green-700">
                  Female
                </span>
              </label>
            </div>
          </fieldset>
        </div>
      </section>

      <!-- Assignment -->
      <section class="px-6 py-6 sm:px-8">

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="department-id" class="block text-sm font-medium text-stone-700">Department</label>
            <select id="department-id" formControlName="department_id"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 py-2 pl-3 pr-8 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500">
              <option value="" disabled>Select a department</option>
              @for (department of departments; track department.department_id) {
                <option [value]="department.department_id">
                  {{ department.department_name }}
                </option>
              }
            </select>
          </div>

          <div>
            <label for="church-id" class="block text-sm font-medium text-stone-700">Church</label>
            <select id="church-id" formControlName="church_id"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 py-2 pl-3 pr-8 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500">
              <option value="" disabled>Select a church</option>
              @for (district of districts; track district.church_id) {
                <option [value]="district.church_id">{{ district.name }}</option>
              }
            </select>
          </div>
        </div>
      </section>

      <!-- Sign-in -->
      <section class="px-6 py-6 sm:px-8">

        <div class="grid grid-cols-1 gap-4">
          <div>
            <label for="email" class="block text-sm font-medium text-stone-700">Email address</label>
            <input id="email" formControlName="email" type="email" autocomplete="email" placeholder="name@company.com"
              class="mt-1.5 block w-full rounded-lg border-0 bg-stone-50 px-3 py-2 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-stone-700">Password</label>
            <div class="relative mt-1.5">
              <input #pw id="password" formControlName="password" type="password" autocomplete="new-password"
                placeholder="At least 8 characters"
                class="block w-full rounded-lg border-0 bg-stone-50 py-2 pl-3 pr-16 text-sm text-stone-900 ring-1 ring-inset ring-stone-300 transition placeholder:text-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-green-700 [&.ng-invalid.ng-touched]:ring-red-500" />
              <button type="button" (click)="pw.type = pw.type === 'password' ? 'text' : 'password'"
                class="absolute inset-y-0 right-0 flex items-center rounded-r-lg px-3 text-xs font-medium text-green-800 hover:text-green-950 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-green-700">
                {{ pw.type === 'password' ? 'Show' : 'Hide' }}
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Actions -->
    <footer class="flex flex-col-reverse gap-2 border-t border-stone-200 bg-stone-50 px-6 py-4 sm:flex-row sm:justify-end sm:px-8">
      <button type="button" (click)="form.reset()"
        class="rounded-lg px-4 py-2 text-sm font-medium text-stone-700 ring-1 ring-inset ring-stone-300 transition hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-stone-500">
        Cancel
      </button>
      <button type="submit"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-green-800 px-5 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-green-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700 focus-visible:ring-offset-2">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        Create user
      </button>
    </footer>
  </form>
</div>
