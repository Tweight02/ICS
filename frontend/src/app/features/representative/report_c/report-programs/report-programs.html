<!-- One reusable cell for Q1-Q4 -->
<ng-template #qcell let-v>
  <div class="flex items-center justify-center">

    <span *ngIf="v.progress === null || v.progress === 0" class="monitoring-status-empty">-</span>

    <span
      *ngIf="v.approved && v.progress !== 0 && v.progress !== null"
      title="Complete"
      class="monitoring-status-check">
      ✓
    </span>

    <span
      *ngIf="!v.approved && v.progress !== null && v.progress > 0"
      [attr.title]="'Report data entered: ' + v.progress + '%'"
      class="monitoring-status-percent">
      {{ v.progress }}%
    </span>

  </div>
</ng-template>


<div class="report-responsive-page monitoring-list-shell min-h-screen px-4 py-6 text-emerald-950 sm:px-8 lg:px-10">
  <div class="monitoring-content">

    <!-- HEADER -->
    <header class="monitoring-header">
      <div>
        <p class="monitoring-kicker">Church report</p>
        <h1 class="monitoring-title">
          {{ churchName || 'Church Reports' }}
        </h1>
        <p class="monitoring-subtitle">
          {{ districtName }}
        </p>
      </div>
    </header>

    <!-- ERROR -->
    <div
      *ngIf="errorMessage"
      role="alert"
      class="mb-4 flex items-start gap-2 rounded-xl border border-red-200 bg-red-50/90
             px-4 py-3 text-sm text-red-700 backdrop-blur-md">
      <span aria-hidden="true">⚠</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- LOADING -->
    <div
      *ngIf="loading"
      class="mx-auto flex w-fit flex-col items-center gap-3 rounded-2xl border border-white/60
             bg-white/60 px-10 py-8 text-emerald-900 shadow-lg shadow-emerald-950/5 backdrop-blur-xl">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-emerald-200 border-t-emerald-700"></div>
      <p class="text-sm font-medium">Loading reports...</p>
    </div>

    <!-- TABLE -->
    <div
      *ngIf="!loading && !errorMessage && representativeDepartments.length > 0"
      class="monitoring-panel h-fit self-start">

      <div class="overflow-x-auto">
        <table class="report-table monitoring-table">

          <thead>
            <tr class="bg-emerald-900/10 text-xs font-bold uppercase tracking-wider text-emerald-950">
              <th scope="col" class="w-[35%] min-w-[220px] px-5 py-3.5 text-left align-middle">Department</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q1</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q2</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q3</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q4</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let department of representativeDepartments; let i = index; trackBy: trackDepartment"
              class="monitoring-row group"
              (click)="openDepartment(department)">

              <!-- Icon + name -->
              <td data-label="Department" class="monitoring-name-cell">
                <div class="monitoring-name-wrap">
                  <span
                    class="monitoring-icon">
                    <i
                      class="bi text-base"
                      [ngClass]="getDepartmentIcon(department.department_name)">
                    </i>
                  </span>

                  <span>
                    {{ department.department_name }}
                  </span>

                  <svg
                    class="monitoring-chevron h-4 w-4"
                    viewBox="0 0 20 20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M8 5l5 5-5 5" />
                  </svg>
                </div>
              </td>

              <td data-label="Q1" class="monitoring-cell">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q1 }">
                </ng-container>
              </td>

              <td data-label="Q2" class="monitoring-cell">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q2 }">
                </ng-container>
              </td>

              <td data-label="Q3" class="monitoring-cell">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q3 }">
                </ng-container>
              </td>

              <td data-label="Q4" class="monitoring-cell">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q4 }">
                </ng-container>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>

    <!-- EMPTY STATE -->
    <div
      *ngIf="!loading && !errorMessage && representativeDepartments.length === 0"
      class="monitoring-empty mx-auto max-w-md">
      <div
        class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl
               bg-emerald-700/10 text-2xl text-emerald-700">
        <i class="bi bi-clipboard-x"></i>
      </div>
      <h3 class="text-lg font-semibold text-emerald-950">No Reports Available</h3>
      <p class="mt-1 text-sm text-emerald-900/70">
        There are currently no reports assigned to the church representative.
      </p>
    </div>

  </div>
</div>
