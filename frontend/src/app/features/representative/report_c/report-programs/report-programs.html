<!-- One reusable cell for Q1-Q4 -->
<ng-template #qcell let-v>
  <div class="flex items-center justify-center">

    <span *ngIf="v.progress === null || v.progress === 0" class="text-sm text-emerald-900/40">-</span>

    <span
      *ngIf="v.approved && v.progress !== 0 && v.progress !== null"
      title="Complete"
      class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-emerald-700
             text-xs font-bold text-white shadow-sm">
      ✓
    </span>

    <span
      *ngIf="!v.approved && v.progress !== null && v.progress > 0"
      [attr.title]="'Report data entered: ' + v.progress + '%'"
      class="text-sm font-semibold tabular-nums text-emerald-800">
      {{ v.progress }}%
    </span>

  </div>
</ng-template>


<div class="report-responsive-page min-h-screen px-4 py-6 text-emerald-950 sm:px-8 lg:px-10">
  <div class="mx-auto max-w-6xl">

    <!-- HEADER -->
    <header class="mb-6">
      <h1 class="font-serif text-2xl font-bold tracking-tight text-emerald-950 sm:text-3xl">
        {{ churchName || 'Church Reports' }}
      </h1>
      <p class="mt-0.5 text-sm font-medium text-emerald-900/70">
        {{ districtName }}
      </p>
    </header>

    <!-- ERROR -->
    <div
      *ngIf="errorMessage"
      role="alert"
      class="mb-4 flex items-start gap-2 rounded-xl border border-red-200 bg-red-50/90
             px-4 py-3 text-sm text-red-700 backdrop-blur-md">
      <span aria-hidden="true">⚠</span>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- LOADING -->
    <div
      *ngIf="loading"
      class="mx-auto flex w-fit flex-col items-center gap-3 rounded-2xl border border-white/60
             bg-white/60 px-10 py-8 text-emerald-900 shadow-lg shadow-emerald-950/5 backdrop-blur-xl">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-emerald-200 border-t-emerald-700"></div>
      <p class="text-sm font-medium">Loading reports...</p>
    </div>

    <!-- TABLE -->
    <div
      *ngIf="!loading && !errorMessage && representativeDepartments.length > 0"
      class="h-fit self-start overflow-hidden rounded-2xl border border-white/60 bg-white/60
             shadow-lg shadow-emerald-950/5 backdrop-blur-xl">

      <div class="overflow-x-auto">
        <table class="report-table w-full border-collapse">

          <thead>
            <tr class="bg-emerald-900/10 text-xs font-bold uppercase tracking-wider text-emerald-950">
              <th scope="col" class="w-[35%] min-w-[220px] px-5 py-3.5 text-left align-middle">Department</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q1</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q2</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q3</th>
              <th scope="col" class="min-w-[140px] px-3 py-3.5 text-center align-middle">Q4</th>
            </tr>
          </thead>

          <tbody>
            <tr
              *ngFor="let department of representativeDepartments; let i = index; trackBy: trackDepartment"
              class="group cursor-pointer border-t border-emerald-900/5 transition hover:bg-white/70"
              (click)="openDepartment(department)">

              <!-- Icon + name -->
              <td data-label="Department" class="px-5 py-3.5">
                <div class="flex items-center gap-3">
                  <span
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-emerald-700/10
                           text-emerald-700 transition group-hover:bg-emerald-700 group-hover:text-white">
                    <i
                      class="bi text-base"
                      [ngClass]="getDepartmentIcon(department.department_name)">
                    </i>
                  </span>

                  <span class="text-sm font-semibold text-emerald-950">
                    {{ department.department_name }}
                  </span>

                  <svg
                    class="ml-auto h-4 w-4 -translate-x-1 text-emerald-700 opacity-0 transition
                           group-hover:translate-x-0 group-hover:opacity-100"
                    viewBox="0 0 20 20" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M8 5l5 5-5 5" />
                  </svg>
                </div>
              </td>

              <td data-label="Q1" class="px-3 py-3.5 text-center">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q1 }">
                </ng-container>
              </td>

              <td data-label="Q2" class="px-3 py-3.5 text-center">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q2 }">
                </ng-container>
              </td>

              <td data-label="Q3" class="px-3 py-3.5 text-center">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q3 }">
                </ng-container>
              </td>

              <td data-label="Q4" class="px-3 py-3.5 text-center">
                <ng-container
                  *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q4 }">
                </ng-container>
              </td>
            </tr>
          </tbody>

        </table>
      </div>
    </div>

    <!-- EMPTY STATE -->
    <div
      *ngIf="!loading && !errorMessage && representativeDepartments.length === 0"
      class="mx-auto max-w-md rounded-2xl border border-white/60 bg-white/60 px-8 py-12
             text-center shadow-lg shadow-emerald-950/5 backdrop-blur-xl">
      <div
        class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl
               bg-emerald-700/10 text-2xl text-emerald-700">
        <i class="bi bi-clipboard-x"></i>
      </div>
      <h3 class="text-lg font-semibold text-emerald-950">No Reports Available</h3>
      <p class="mt-1 text-sm text-emerald-900/70">
        There are currently no reports assigned to the church representative.
      </p>
    </div>

  </div>
</div>
