<!-- One reusable cell for Q1-Q4 -->
<ng-template #qcell let-v>
  <div class="flex items-center justify-center">

    <span *ngIf="v === null" class="text-sm text-emerald-900/70">–</span>

    <span
      *ngIf="v === 100"
      class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-emerald-500 text-sm font-bold text-white shadow"
    >✓</span>

    <div *ngIf="v !== null && v !== 100" class="flex items-center gap-2">
      <span class="text-sm text-emerald-950">{{ v }}%</span>
      <div class="h-2 w-32 overflow-hidden rounded-full bg-white/80">
        <div class="h-full rounded-full bg-amber-400" [style.width.%]="v"></div>
      </div>
    </div>

  </div>
</ng-template>


<div class="p-6">

  <!-- Header -->
  <div class="mb-6">
    <button
      type="button"
      class="mb-3 rounded-lg border border-emerald-900/20 bg-white/70 px-3 py-2 text-sm font-semibold text-emerald-900 hover:bg-emerald-50"
      (click)="backToReports()"
    >
      ← Back
    </button>

    <p class="text-xs font-semibold tracking-widest text-emerald-700">REPORT MANAGEMENT</p>
    <h1 class="text-2xl font-bold text-emerald-950">{{ churchName }}</h1>
    <p class="text-sm text-emerald-900/70">{{ districtName }}</p>
  </div>

  <!-- Error -->
  <div
    *ngIf="errorMessage"
    class="mb-4 rounded-lg bg-red-100 px-4 py-3 text-sm text-red-800"
  >
    {{ errorMessage }}
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex flex-col items-center gap-3 py-10 text-emerald-900/70">
    <div class="h-8 w-8 animate-spin rounded-full border-4 border-emerald-200 border-t-emerald-600"></div>
    <p class="text-sm">Loading reports...</p>
  </div>

  <!-- Table -->
  <div
    *ngIf="!loading && !errorMessage && representativeDepartments.length > 0"
    class="overflow-hidden rounded-xl border border-white/70 bg-white/40 shadow-sm backdrop-blur-md"
  >
    <table class="w-full border-collapse">

      <thead>
        <tr class="bg-black/5 text-sm font-bold text-emerald-950">
          <th class="w-[35%] px-6 py-5 text-left">Department</th>
          <th class="px-6 py-5 text-center">Q1</th>
          <th class="px-6 py-5 text-center">Q2</th>
          <th class="px-6 py-5 text-center">Q3</th>
          <th class="px-6 py-5 text-center">Q4</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let department of representativeDepartments; let i = index; trackBy: trackDepartment"
          class="cursor-pointer border-t border-white/60 odd:bg-white/60 even:bg-black/5 transition hover:bg-emerald-100/60"
          (click)="openDepartment(department)"
        >
          <td class="px-6 py-6 text-sm font-semibold text-emerald-900">
            {{ department.department_name }}
          </td>

          <td class="px-6 py-6">
            <ng-container
              *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q1 }"
            ></ng-container>
          </td>

          <td class="px-6 py-6">
            <ng-container
              *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q2 }"
            ></ng-container>
          </td>

          <td class="px-6 py-6">
            <ng-container
              *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q3 }"
            ></ng-container>
          </td>

          <td class="px-6 py-6">
            <ng-container
              *ngTemplateOutlet="qcell; context: { $implicit: getMonitoring(i).q4 }"
            ></ng-container>
          </td>
        </tr>
      </tbody>

    </table>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="!loading && !errorMessage && representativeDepartments.length === 0"
    class="py-12 text-center"
  >
    <div class="mb-2 text-4xl">📋</div>
    <h3 class="text-lg font-semibold text-emerald-950">No Reports Available</h3>
    <p class="text-sm text-emerald-900/70">
      There are currently no reports assigned to the church representative.
    </p>
  </div>

</div>
